
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">
    <title>Order Confirmation | BugHunter Shop</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>BugHunter Shop</h1>
        <p>Order Confirmation</p>
    </header>

    <main>
        <section class="confirmation-card">
            <div class="success-icon">✓</div>

            <h2>Order Confirmed!</h2>

            <p>
                Thank you for your order.
                Your demo purchase was successful.
            </p>

            <p class="confirmation-note">
                This is a simulated order.
                No real payment has been processed.
            </p>

            <a href="products.html" class="back-button">
                Continue Shopping
            </a>
        </section>
    </main>

</body>
</html>
